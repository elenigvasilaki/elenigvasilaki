name: Star Chart

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  star-chart:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate star chart
        uses: leereilly/star-chart@v0.3
        with:
          token: ${{ github.token }}
          repositories: |
            elenigvasilaki/ImportRegex
            elenigvasilaki/pca_inR
            elenigvasilaki/datagovgR
          output: assets/stars.svg
          style: sparkline
          period: all

      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stars.svg
          git diff --cached --quiet || git commit -m "Update star history"
          git push
